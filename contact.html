<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Thazneem B. Salim</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --primary:#3a3aff;
  --secondary:#ff2ea0;
  --dark:#0b0c1a;
  --glass:rgba(255,255,255,0.06);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  background:var(--dark);
  color:#f5f6fa;
}

a{text-decoration:none;color:inherit}

/* BACKGROUND */
#bg-network{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

nav,section,footer{position:relative;z-index:2}

/* NAV */
nav{
  height:72px;
  padding:14px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(90deg,rgba(58,58,255,.2),rgba(255,46,160,.2));
  backdrop-filter:blur(10px);
}
nav img{height:48px;border-radius:12px}

.nav-links{
  display:flex;
  gap:28px;
  list-style:none;
}
.nav-links a{
  font-weight:600;
  color:#d6d6d6;
}
.nav-links a:hover,
.nav-links a.active{
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* HEADER (reduced padding) */
.contact-header{
  text-align:center;
  padding:26px 20px 10px;
}
.contact-header h1{
  font-size:2.5rem;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.contact-header p{
  margin-top:8px;
  color:#bbb;
}

/* MAIN */
.contact-wrapper{
  height:calc(100vh - 72px - 60px);
  display:flex;
  align-items:flex-start; /* 🔼 moves section up */
  justify-content:center;
  padding:20px 40px 0;
}

.contact-card{
  width:100%;
  max-width:1100px;
  background:var(--glass);
  border-radius:22px;
  padding:36px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:40px;
}

/* INFO */
.contact-info a{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  color:#ccc;
  transition:.3s;
}
.contact-info a i{color:var(--secondary)}
.contact-info a:hover{
  transform:translateX(6px);
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* FORM */
.contact-form input,
.contact-form textarea{
  width:100%;
  padding:14px 16px;
  margin-bottom:14px;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,.08);
  color:#fff;
}
.contact-form textarea{resize:none}

.contact-form button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:600;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  cursor:pointer;
  transition:.3s;
}
.contact-form button:hover{transform:translateY(-4px)}

/* FOOTER */
footer{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
}

/* MOBILE */
@media(max-width:900px){
  .contact-card{grid-template-columns:1fr}
}
@media(max-width:768px){
  nav{padding:12px 18px}
  .contact-wrapper{padding:12px 20px 0}
}
</style>
</head>

<body>

<canvas id="bg-network"></canvas>

<nav>
  <img src="Geometric BT Monogram in Gradient.png" alt="logo">
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="Resume.html">Resume</a></li>
    <li><a href="project.html">Projects</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<section class="contact-header">
  <h1>Contact Me</h1>
  <p>Let’s connect and build something meaningful</p>
</section>

<div class="contact-wrapper">
  <div class="contact-card">

    <div class="contact-info">
      <a href="#"><i class="fas fa-user"></i> Thazneem B. Salim</a>
      <a href="mailto:thazneemsalim3@gmail.com"><i class="fas fa-envelope"></i> thazneemsalim3@gmail.com</a>
      <a href="tel:+919633174066"><i class="fas fa-phone"></i> +91 9633174066</a>
      <a href="https://www.linkedin.com/in/thazneem-b-salim/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
      <a href="https://github.com/Thazneem3" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="#"><i class="fas fa-map-marker-alt"></i> Trivandrum, Kerala</a>
    </div>

    <form class="contact-form">
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="tel" placeholder="Phone Number">
      <textarea rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

  </div>
</div>

<footer>
  © 2025 Thazneem B. Salim. All Rights Reserved.
</footer>

</body>
</html>
